name: SDXS Tiny AI Android
on:
  push:
    branches: [sdxs-tiny-text2image]
    paths:
      - 'sdxs-tiny-ai/**'
      - '.github/workflows/sdxs-tiny-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout Android native runtime base
        run: |
          git clone https://github.com/akleine/sdcpp-on-android.git /tmp/sdcpp
          cd /tmp/sdcpp
          git checkout 98141505007657192d3aa37584079c1ac476761b
      - name: Apply SDXS Tiny AI branding
        run: |
          cp sdxs-tiny-ai/app-overrides/strings.xml /tmp/sdcpp/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "local.kleine.sdcpp"/applicationId = "com.sdxstiny.ai"/' /tmp/sdcpp/app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "0.1.0"/' /tmp/sdcpp/app/build.gradle.kts
      - name: Build debug APK
        working-directory: /tmp/sdcpp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sdxs-tiny-ai-debug-apk
          path: /tmp/sdcpp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
