name: Bengali Wikipedia pretraining

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freemind-scratch/**"
      - ".github/workflows/prepare-bengali-wikipedia.yml"

permissions:
  contents: read

jobs:
  prepare-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch and dataset tools
        run: python -m pip install --upgrade pip torch datasets
      - name: Stream all Bengali Wikipedia articles
        run: python freemind-scratch/prepare_wikipedia_bn.py
      - name: Verify corpus completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("freemind-scratch/data/wikipedia_bn/bn_wikipedia.txt")
          m = json.loads(Path("freemind-scratch/data/wikipedia_bn/dataset_manifest.json").read_text())
          assert p.stat().st_size > 1_000_000_000, f"Corpus too small: {p.stat().st_size}"
          assert m["articles_written"] == m["expected_articles_from_dataset_card"] == 187386, m
          print(f"Verified {m['articles_written']:,} articles, {p.stat().st_size:,} bytes")
          PY
      - name: Train from scratch on complete Bengali Wikipedia
        run: python freemind-scratch/train.py --steps 10000 --save-every 500
      - name: Build Bengali instruction-response examples
        run: python freemind-scratch/build_instruction_data.py --min-examples 10000
      - name: Fine-tune pretrained model on instruction responses
        run: python freemind-scratch/finetune_instruction.py --steps 1500 --batch-size 8
      - name: Upload pretrained and instruction-tuned checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freemind-bengali-instruction-finetuned
          path: |
            freemind-scratch/outputs/
            freemind-scratch/data/wikipedia_bn/dataset_manifest.json
            freemind-scratch/data/instruction_bn/
          if-no-files-found: warn
          retention-days: 30
