name: FreeMind CPU smoke training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Small CPU smoke-test epochs"
        required: true
        default: "2"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run smoke training
        working-directory: freemind-ai
        run: python train.py --epochs "${{ inputs.epochs }}" --batch-size 8
      - name: Upload experimental checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: freemind-ai-experimental-checkpoint
          path: freemind-ai/artifacts/freemind_gru.pt
          if-no-files-found: error
          retention-days: 7
