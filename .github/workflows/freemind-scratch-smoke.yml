name: FreeMind scratch pipeline smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'freemind-scratch/**'
      - '.github/workflows/freemind-scratch-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
      - name: Verify target parameter count
        run: python freemind-scratch/train.py --count-params
      - name: Run tiny smoke training (not full pretraining)
        env:
          FREEMIND_SMOKE: '1'
        run: python freemind-scratch/train.py --steps 8 --batch-size 2 --save-every 8
      - name: Upload smoke checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: freemind-scratch-smoke-checkpoint
          path: freemind-scratch/outputs/freemind_scratch.pt
          if-no-files-found: error
